services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: casetrace_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe owner password}
      POSTGRES_DB: casetrace
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U casetrace_owner -d casetrace']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db: {condition: service_healthy}
    environment: &settings
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://casetrace_owner:${POSTGRES_PASSWORD}@db:5432/casetrace
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set an independent URL-safe application password}
      JWT_SECRET: ${JWT_SECRET:?Set an independent random signing key of at least 48 characters}
      ALLOWED_ORIGIN: https://${CASETRACE_DOMAIN:?Set the installation domain}
    command: [sh, -c, 'alembic upgrade head && python -m app.provision']
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://casetrace_app:${APP_DATABASE_PASSWORD}@db:5432/casetrace
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: https://${CASETRACE_DOMAIN}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    read_only: true
    tmpfs: ['/tmp:size=96m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build: frontend
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on: [web]
    environment:
      CASETRACE_DOMAIN: ${CASETRACE_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway_config:/config
volumes:
  database:
  certificates:
  gateway_config:
