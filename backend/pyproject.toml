[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "investigation-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6,<4",
    "networkx>=3.4,<4",
    "pgvector>=0.4,<1",
    "pillow>=11.3,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "pyjwt>=2.10,<3",
    "pypdf>=6.1,<7",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0.40,<3",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["faker>=37,<41", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.case_types.financial_fraud" = ["*.yaml", "templates/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
