# Disposable local verification; use a unique Compose project name.
services:
  db:
    environment:
      POSTGRES_DB: casetrace_test
    ports: ["127.0.0.1:15432:5432"]
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://investigation:${POSTGRES_PASSWORD}@db:5432/casetrace_test
      ALLOWED_ORIGIN: http://localhost:15173
    ports: !override ["127.0.0.1:18000:8000"]
  web:
    ports: !override ["127.0.0.1:15173:80"]
