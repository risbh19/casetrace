name: Verify changes
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: investigation
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: casetrace_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U investigation" --health-interval 3s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://investigation:ci-only@localhost:5432/casetrace_test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://investigation:ci-only@localhost:5432/casetrace_test' || '' }}
      RUN_OCR_TESTS: '1'
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils
      - run: python -m pip install --upgrade 'pip>=26.3,<27'
      - run: pip install -r requirements.lock && pip install -e ".[dev]" pip-audit
      - run: ruff check . ../scripts
      - run: pip-audit --local --skip-editable
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r ../backend/requirements.lock && python -m pip install --no-deps ../backend
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
